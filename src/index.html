<style>
:root {
  --bg: #f0f2f5; --surface: #ffffff; --surface2: #f7f8fa; --border: #e2e6ed;
  --text: #1a2035; --dim: #6b7489; --bright: #0d1526;
  --accent: #0070f3; --gain: #0a9e6e; --loss: #d62f3c; --warn: #b7791f;
  --c1: #0070f3; --c2: #7c3aed; --c3: #0a9e6e; --c4: #e8590c; --c5: #d62f3c;
  --c6: #b7791f; --c7: #0b7285; --c8: #868e96; --c9: #c2255c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #171b23; --surface2: #1d222c; --border: #2a303c;
    --text: #d6dbe5; --dim: #8a93a6; --bright: #f1f4f9;
    --accent: #4c9bff; --gain: #34c38f; --loss: #ff6b6b; --warn: #f0b429;
    --c1: #4c9bff; --c2: #a78bfa; --c3: #34c38f; --c4: #ff922b; --c5: #ff6b6b;
    --c6: #f0b429; --c7: #3bc9db; --c8: #adb5bd; --c9: #f783ac;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #171b23; --surface2: #1d222c; --border: #2a303c;
  --text: #d6dbe5; --dim: #8a93a6; --bright: #f1f4f9;
  --accent: #4c9bff; --gain: #34c38f; --loss: #ff6b6b; --warn: #f0b429;
  --c1: #4c9bff; --c2: #a78bfa; --c3: #34c38f; --c4: #ff922b; --c5: #ff6b6b;
  --c6: #f0b429; --c7: #3bc9db; --c8: #adb5bd; --c9: #f783ac;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 'IBM Plex Sans', system-ui, sans-serif; }
.num, td.n, th.n { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 16px; font-weight: 600; color: var(--bright); margin-right: auto; }
select, input[type=date], button { font: inherit; color: var(--text); background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px; }
button { cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: var(--surface2); }
.seg button.on { background: var(--accent); color: #fff; }
nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
nav button { border-radius: 6px 6px 0 0; border-bottom: 0; background: transparent; }
nav button.on { background: var(--surface); color: var(--bright); font-weight: 600; }
main { padding: 0 20px 40px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; padding: 18px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
.kpi { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.kpi .l { font-size: 12px; color: var(--dim); }
.kpi .v { font: 500 20px 'IBM Plex Mono', monospace; color: var(--bright); margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--dim); margin-top: 2px; }
.kpi.big { grid-column: span 2; }
/* первая строка сводки — всегда в один ряд: колонки делят ширину, шрифт зависит от ширины окна */
.kpis.onerow { grid-template-columns: 1.5fr repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
.kpis.onerow .kpi { padding: 9px 10px; min-width: 0; }
.kpis.onerow .kpi.big { grid-column: auto; }
.kpis.onerow .kpi .v { font-size: clamp(13px, 1.2vw, 20px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpis.onerow .kpi.big .v { font-size: clamp(16px, 1.7vw, 28px); }
.kpis.onerow .kpi .l, .kpis.onerow .kpi .s { font-size: clamp(10px, 0.75vw, 12px); }
@media (max-width: 1000px) { .kpis.onerow { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); } .kpis.onerow .kpi.big { grid-column: span 2; } }
.kpi.big .v { font-size: 28px; }
@media (max-width: 600px) { .kpi.big { grid-column: span 1; } }
.kpi.rate { border-color: var(--accent); }
.kpi.rate .v { color: var(--accent); }
.kpi.bad .v { color: var(--loss); }
h2 { font-size: 14px; font-weight: 600; color: var(--bright); margin: 18px 0 8px; }
h2:first-child { margin-top: 0; }
.note { font-size: 12px; color: var(--dim); margin: 4px 0 10px; max-width: 900px; }
.chart { position: relative; height: 300px; }
.chart.tall { height: 380px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
.tbl { overflow-x: auto; max-height: 560px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 5px 9px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { position: sticky; top: 0; background: var(--surface2); font-weight: 500; color: var(--dim); cursor: pointer; user-select: none; }
td.n, th.n { text-align: right; }
tr.tot td { font-weight: 600; background: var(--surface2); }
.pos { color: var(--gain); } .neg { color: var(--loss); } .warn { color: var(--warn); }
.drop { border: 2px dashed var(--border); border-radius: 10px; padding: 34px 20px; text-align: center; color: var(--dim); background: var(--surface); }
.drop.over { border-color: var(--accent); color: var(--accent); }
.drop b { color: var(--bright); }
.progress { margin-top: 12px; font-size: 13px; }
.bar { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.empty { padding: 50px 20px; text-align: center; color: var(--dim); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); }
.chip button.x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 4px; font-size: 13px; line-height: 1; }
.rejected li button, .infobox li button { margin: 4px 6px 0 0; font-size: 12px; }
.infobox { margin-top: 16px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.infobox h2 { margin-top: 0; }
.infobox ul { margin: 4px 0 0 18px; }
.hide { display: none !important; }
.posgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-bottom: 8px; }
.poscell { display: flex; justify-content: space-between; gap: 8px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface2); font-size: 13px; }
.poscell b { font: 500 13px 'IBM Plex Mono', monospace; }
footer { padding: 14px 20px 26px; font-size: 12px; color: var(--dim); text-align: center; }
footer a { color: var(--dim); }
.req { font-size: 16px; font-weight: 600; color: var(--bright); margin-bottom: 8px; }
.path { display: inline-block; margin: 0 0 10px; padding: 6px 12px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--accent); color: var(--bright); font-size: 14px; }
.reqlist { text-align: left; display: inline-block; margin: 0 0 12px; padding-left: 20px; font-size: 13px; color: var(--text); }
.reqlist li { margin: 2px 0; }
.rejected { margin-top: 16px; border: 1px solid var(--loss); border-radius: 8px; padding: 10px 12px; }
.rejected h2 { color: var(--loss); margin-top: 0; }
.panel { position: relative; }
.panel.blocked > *:not(.blocker) { filter: blur(6px) grayscale(0.6); pointer-events: none; user-select: none; }
.blocker { position: absolute; inset: 0; z-index: 4; display: flex; align-items: flex-start; justify-content: center; padding-top: 80px; background: color-mix(in srgb, var(--surface) 35%, transparent); }
.blockcard { max-width: 760px; background: var(--surface); border: 2px solid var(--loss); border-radius: 10px; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
.blockcard .rejected { border: 0; padding: 0; margin: 0; }
.blockbtns { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.blockbtns #gapShow { background: transparent; border-color: var(--border); color: var(--dim); font-size: 12px; }
.gaps { margin: 0 0 16px; background: color-mix(in srgb, var(--loss) 8%, var(--surface)); }
.gaps ul { margin: 4px 0 0 18px; color: var(--loss); }
</style>

<!-- Разбор справки ФИНАМ («Справка о состоянии обязательств», HTML с расширением .xls).
     Выполняется в фоновом потоке, чтобы страница не замирала на больших справках. -->
<script type="text/plain" id="parserSrc">/*! Брокерская аналитика ФИНАМ · © 2026 Дмитрий Овчинников · CC BY-NC-ND 4.0 */

// Меняйте при любом изменении того, что разборщик достаёт из справки: старые разборы в браузере
// пересчитать нельзя (исходные файлы не хранятся), страница попросит загрузить их заново.
const PARSER_VERSION = 8;
const DATE_RE = /^\d\d\.\d\d\.\d{4}$/;
function num(x) {
  if (!x) return 0;
  let s = String(x).replace(/[\s\u00A0]/g, '').replace(/[−–—]/g, '-').replace(',', '.');
  if (/^\((.*)\)$/.test(s)) s = '-' + s.slice(1, -1);
  const v = parseFloat(s);
  return isFinite(v) ? v : 0;
}
function iso(d) { const m = /(\d\d)\.(\d\d)\.(\d{4})/.exec(d || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; }
function decode(s) {
  return s.replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
          .replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d)).replace(/&amp;/g, '&');
}
function rows(t) {
  const out = [], re = /<tr[^>]*>([\s\S]*?)<\/tr>/gi; let m;
  while ((m = re.exec(t))) {
    const cells = [], rc = /<t[dh][^>]*>([\s\S]*?)<\/t[dh]>/gi; let c;
    while ((c = rc.exec(m[1]))) cells.push(decode(c[1].replace(/<[^>]+>/g, '')).replace(/\s+/g, ' ').trim());
    if (cells.length) out.push(cells);
  }
  return out;
}
function section(s, start, stops) {
  let i = s.indexOf(start); if (i < 0) return '';
  const tr = s.lastIndexOf('<tr', i); if (tr >= 0 && i - tr < 4000) i = tr;   // заголовок может стоять внутри строки таблицы
  let j = s.length;
  for (const st of stops || []) { const k = s.indexOf(st, i + start.length); if (k > 0 && k < j) j = k; }
  return s.slice(i, j);
}
// неторговое списание брокера → статья
function classify(type, comment) {
  const c = (comment || '').toLowerCase();
  if (type === 'Пеня') return 'penalty';
  if (type !== 'Комиссия брокерская') return 'other';
  if (c.includes('недостаточности го')) return 'goShortfall';
  if (/за период с \d\d\.\d\d\.\d{4} по \d\d\.\d\d\.\d{4}/.test(c)) return 'monthly';
  if (c.includes('17.12') || c.includes('заключение договоров')) return 'repoContracts';
  if (c.includes('маржинальн')) return 'marginLoan';
  return c ? 'brokerOther' : 'brokerUnknown';
}
// неторговое зачисление → вид дохода; погашение номинала и ввод денег доходом не считаются
function creditClass(type, comment) {
  const t = ((type || '') + ' ' + (comment || '')).toLowerCase();
  if (/процент\S* по договорам займа|займ\S* ценн/.test(t)) return 'lending';
  if (/купон/.test(t)) return 'coupon';
  if (/дивиденд/.test(t)) return 'dividend';
  if (/погашени|амортизац/.test(t)) return 'redemption';
  if (/ввод|зачисление дс|перевод/.test(t)) return 'deposit';
  return 'otherIncome';
}
function secClass(desc) {
  const d = (desc || '').toLowerCase();
  if (/(^|[ ,])(обл|облигац)/.test(d)) return 'bonds';
  if (/паи|пиф|etf|бпиф/.test(d)) return /финам/.test(d) ? 'funds' : 'shares';   // по фондам ФИНАМ брокер комиссию не берёт
  return 'shares';
}

// Коды отказа разбираются на странице в понятные сообщения
function reject(code, extra) { const e = new Error(code); e.code = code; e.extra = extra || ''; throw e; }
function parseReport(s) {
  const lead = s.slice(0, 2000);
  if (/^PK|^\uFFFD?\uFFFD?\u0000|\u0000/.test(lead) || /^\s*PK\u0003\u0004/.test(lead)) reject('BINARY');
  const head = s.slice(0, 20000), headText = head.replace(/<[^>]+>/g, ' ');
  if (!/Справка о состоянии обязательств/.test(headText)) reject('NOT_STATEMENT');
  const per = /период\s+\S\s+(\d\d\.\d\d\.\d{4})\s+по\s+(\d\d\.\d\d\.\d{4})/.exec(headText);
  if (!per) reject('NOT_STATEMENT');
  let account = '';
  for (const c of rows(section(s, 'По счету', ['1. Оценка']))) if (/По счету/.test(c[0])) { account = c[1]; break; }
  if (!account) reject('NOT_STATEMENT');
  const r = { v: PARSER_VERSION, account, date: iso(per[1]), dateTo: iso(per[2]), summary: {}, money: {}, flows: {},
              positions: {}, holdings: {}, planned: {}, nontrade: [], tradeComm: 0,
              exchPaid: 0, exchPending: 0, penalty: 0, tax: 0, carry: 0, repoDiff: 0, otherIncome: 0,
              futByPay: {}, secTrades: {}, hasTrades: false, credits: [], moves: [],
              commFut: null, commSec: null, commRepo: null, repoNeed: 0, repoVolume: 0,
              dated: {}, futNet: {}, isPeriod: false, futDeals: {} };
  // справка за период: оценка счёта, деньги, ГО, позиции — только на начало и конец; затраты и сделки — по датам
  r.isPeriod = r.date !== r.dateTo;
  const D = d => r.dated[d] || (r.dated[d] = { tradeComm: 0, exchPaid: 0, commFut: 0, commSec: 0, commRepo: 0, repoNeed: 0, repoVolume: 0, repoDiff: 0, penalty: 0 });

  const S = { 'Оценка рублевой позиции': 'cash', 'Оценка валютной позиции': 'fx', 'Оценка позиции по немаржируемым': 'nonMarg',
              'Оценка позиции по ПФИ': 'go', 'Оценка позиции по ценным бумагам': 'sec', 'Оценка позиции по драгоценным': 'metals',
              'Оценка требований и обязательств': 'recv', 'Оценка плановых позиций': 'planned', 'ИТОГО оценка': 'total' };
  for (const c of rows(section(s, '1. Оценка состояния', ['Оценка денежной позиции']))) {
    if (c.length < 3) continue;
    for (const k in S) if (c[0].startsWith(k)) r.summary[S[k]] = [num(c[1]), num(c[2])];
  }
  // Рубль: 1 вход, 2 своб., 3 блок.(ГО), 4 долг марж., 5 долг прочий | 8 исход, 9 своб., 10 блок., 11, 12 | 15 план Т+1
  for (const c of rows(section(s, 'Оценка денежной позиции', ['Виды движений']))) {
    if (c[0] === 'Рубль' && c.length >= 16)
      r.money = { in: num(c[1]), out: num(c[8]), free: num(c[9]), blocked: num(c[10]), debtMarg: num(c[11]), debtOther: num(c[12]), t1: num(c[15]) };
  }
  for (const c of rows(section(s, 'Виды движений', ['Оценка позиции по Производным', 'Оценка позиции по ценным', '2. Движения']))) {
    if (c[0] === 'Рубль' && c.length >= 19)
      r.flows = { deposit: num(c[1]), withdraw: num(c[2]), vm: num(c[11]), goChange: num(c[12]), exch: num(c[13]),
                  income: num(c[14]), broker: num(c[15]), tax: num(c[17]) + num(c[18]), other: num(c[19]) };
  }
  // позиции по ПФИ: 7 ВМ факт (оплачена сегодня), 8 ВМ план (за этот торговый день), 10 позиция на конец
  for (const c of rows(section(s, 'Оценка позиции по Производным', ['ГО срочного рынка', 'Оценка позиции по ценным']))) {
    if (c.length >= 11 && c[1] && c[0].startsWith(c[1] + ','))
      r.positions[c[1]] = { pos: num(c[10]), pos0: num(c[2]), vm: num(c[8]), fact: num(c[7]), kind: c[0].split(',')[1]?.trim() || '' };
  }
  for (const c of rows(section(s, 'Оценка позиции по ценным бумагам и иностранным', ['Оценка обязательств по незавершенным', '2. Движения']))) {
    // 3 кол-во на начало, 5 оценка на начало (с НКД), 8 кол-во на конец, 10 оценка на конец (с НКД)
    if (c.length >= 11 && /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(c[2])) {
      const h = r.holdings[c[1]] || (r.holdings[c[1]] = { qty: 0, val: 0, qty0: 0, val0: 0, cls: secClass(c[0]), isin: c[2] });
      h.qty += num(c[8]); h.val += num(c[10]); h.qty0 += num(c[3]); h.val0 += num(c[5]);
    }
  }
  for (const c of rows(section(s, 'Оценка обязательств по незавершенным', ['2. Движения']))) {
    // плановые позиции: 3/8 кол-во, 4/9 оценка (со знаком: продажа до поставки — минус), 7/12 обязательство по оплате
    if (c.length >= 13 && /^[A-Z]{2}[A-Z0-9]{9}\d$/.test(c[2]))
      r.planned[c[1]] = { val: num(c[9]), val0: num(c[4]), obligation: num(c[12]), obligation0: num(c[7]), cls: secClass(c[0]), isin: c[2] };
  }
  for (const c of rows(section(s, '2. Движения по счету', ['Торговые движения']))) {
    if (c[0].includes('(итого)')) continue;
    if (DATE_RE.test(c[0]) && c.length >= 7) {           // неторговые операции, построчный формат
      const debit = num(c[5]), credit = num(c[4]), comment = c[c.length - 1], date = iso(c[0]);
      // ввод, вывод и переводы — движения денег, не затраты и не доход; налог учитывается отдельно
      if (/Ввод ДС|Вывод ДС|Перевод ДС/i.test(c[1]) || (/Зачисление ДС/i.test(c[1]) && !/процент|купон|дивиденд/i.test(comment))) {
        const acc2 = (/Сч[её]т (?:списания|зачисления):\s*(\S+)/.exec(comment) || [])[1] || '';
        r.moves.push({ type: c[1], amount: credit - debit, comment, kind: /Перевод/i.test(c[1]) ? 'transfer' : 'external', account2: acc2, date });
        continue;

// ставка меняется (вслед за ключевой), поэтому для дня берётся пеня ближайшего по времени дня
function dailyRates(sel) {
  const pts = [];
  for (const s of sel) for (const d of s.days) { const cash = d.r.money.out || 0; if (d.r.penalty > 0 && cash < -1000) pts.push([Date.parse(d.date), d.r.penalty / -cash]); }
  const at = date => { if (!pts.length) return NaN; const t = Date.parse(date); let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p; return best[1]; };
  return { at, any: pts.length > 0, range: pts.length ? [Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[1]))] : [] };
}
// состав счёта на конец дня: что брокер может взять в обеспечение и что нет
function coverParts(d) {
  const p = { cash: d.r.money.out || 0, bonds: 0, shares: 0, funds: 0 };
  for (const k in d.r.holdings) { const h = d.r.holdings[k]; p[h.cls] = (p[h.cls] || 0) + h.val; }
  for (const k in d.r.planned) { const h = d.r.planned[k]; if (!h.obligation && h.val) p[h.cls] = (p[h.cls] || 0) + h.val; }   // выданные в заём и т. п.
  return p;
}

/* ---------- загрузка файлов ---------- */
let worker = null;
const WORKER_BOOT = `
self.onmessage = async (e) => {
  const { id, file } = e.data;
  try {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (/windows-1251|cp1251/i.test(text.slice(0, 1000)) || !text.includes('Справка')) {
      try { text = new TextDecoder('windows-1251').decode(buf); } catch (err) {}
    }
    self.postMessage({ id, ok: true, report: parseReport(text) });
  }
  catch (err) { self.postMessage({ id, ok: false, code: err.code || 'ERROR', extra: err.extra || '', error: String(err.message || err) }); }
};`;
function getWorker() {
  if (!worker) worker = new Worker(URL.createObjectURL(new Blob([document.getElementById('parserSrc').textContent + WORKER_BOOT], { type: 'text/javascript' })));
  return worker;
}
let inlineParse = null;
async function parseInline(file) {
  if (!inlineParse) inlineParse = new Function(document.getElementById('parserSrc').textContent + '; return parseReport;')();
  try {
    const buf = await file.arrayBuffer();
    let text = new TextDecoder('utf-8').decode(buf);
    if (/windows-1251|cp1251/i.test(text.slice(0, 1000)) || !text.includes('Справка')) {
      try { text = new TextDecoder('windows-1251').decode(buf); } catch (err) {}
    }
    return { ok: true, report: inlineParse(text) };
  } catch (e) {
    return { ok: false, code: e.code || 'ERROR', extra: e.extra || '', error: String(e.message || e) };
  }
}
function parseFile(file) {
  let w; try { w = getWorker(); } catch (e) { return parseInline(file); }
  return new Promise(res => {
    const id = Math.random().toString(36).slice(2);
    w.onerror = () => { worker = null; res(parseInline(file)); };
    const h = e => { if (e.data.id === id) { w.removeEventListener('message', h); res(e.data); } };
    w.addEventListener('message', h); w.postMessage({ id, file });
  });
}
const REJECT_TEXT = {
  BRIEF: x => `Краткая справка${x ? ' за ' + ddmm(x) : ''}: в ней нет сделок и расшифровки списаний. Выгрузите за этот день полную справку.`,
  MULTI: x => `Справка за период ${x}. Нужны справки за один день каждая — из итогов за период нельзя разложить затраты по дням.`,
  NOT_STATEMENT: () => 'Это не «Справка о состоянии обязательств» ФИНАМ. Результаты анализа, выгрузки из терминала, брокерские отчёты и таблицы не подходят.',
  BINARY: () => 'Это не справка в исходном виде: файл Excel, архив или другой двоичный формат. Загрузите справку так, как её выдал личный кабинет, не пересохраняя в Excel.',
  TOO_BIG: () => 'Файл больше 200 МБ — это не справка за один день.',
  ERROR: (x, e) => 'Не удалось разобрать: ' + e,
};
/* ---------- папка со справками (Chrome, Edge): страница только читает её ---------- */
const FOLDER = { ok: typeof window !== 'undefined' && 'showDirectoryPicker' in window, handle: null, perm: '', last: null, busy: false };
async function folderInit() {
  if (!FOLDER.ok) return;
  try { FOLDER.handle = (await DB.getMeta('dir')) || null; FOLDER.perm = FOLDER.handle ? await FOLDER.handle.queryPermission({ mode: 'read' }) : ''; }
  catch (e) { FOLDER.handle = null; FOLDER.perm = ''; }
  folderButton();
}
function folderButton() {
  const b = document.getElementById('btnFolder'); if (!b) return;
  b.classList.toggle('hide', !FOLDER.handle);
  b.textContent = FOLDER.busy ? 'Просматриваю папку…' : 'Обновить из папки';
}
async function folderConnect() {
  let h;
  try { h = await window.showDirectoryPicker({ id: 'finam-reports', mode: 'read' }); } catch (e) { return; }   // отмена выбора
  await DB.setMeta('dir', h); await DB.setMeta('dirIndex', {});
  FOLDER.handle = h; FOLDER.perm = 'granted'; folderButton();
  await folderScan();
}
async function folderForget() {
  await DB.delMeta('dir'); await DB.delMeta('dirIndex');
  FOLDER.handle = null; FOLDER.perm = ''; FOLDER.last = null; folderButton(); render();
}
// Новые и изменённые файлы (по размеру и времени изменения) — в обычную загрузку; при смене версии разборщика — все.
// Просмотренные файлы запоминаются, в том числе отклонённые: их не разбираем повторно, пока файл не изменится.
async function folderScan() {
  const h = FOLDER.handle; if (!h || FOLDER.busy) return;
  try {
    if ((await h.queryPermission({ mode: 'read' })) !== 'granted' && (await h.requestPermission({ mode: 'read' })) !== 'granted') {
      FOLDER.perm = 'denied'; render(); return;
    }
  } catch (e) { FOLDER.perm = 'denied'; render(); return; }
  FOLDER.perm = 'granted'; FOLDER.busy = true; folderButton();
  try {
    const idx = (await DB.getMeta('dirIndex')) || {}, all = idx.__v !== PARSER_VERSION || state.stale?.length > 0;
    const seen = { __v: PARSER_VERSION }, fresh = [];
    const walk = async (dir, path) => {
      for await (const [name, e] of dir.entries()) {
        if (e.kind === 'directory') { await walk(e, path + name + '/'); continue; }
        if (!/\.xls$/i.test(name)) continue;
        const f = await e.getFile(), sig = f.size + '|' + f.lastModified;
        seen[path + name] = sig; if (all || idx[path + name] !== sig) fresh.push(f);
      }
    };
    await walk(h, '');
    fresh.sort((x, y) => x.lastModified - y.lastModified);     // одна и та же справка скачана дважды — остаётся последняя
    FOLDER.last = { at: new Date(), total: Object.keys(seen).length - 1, fresh: fresh.length };
    if (fresh.length) await loadFiles(fresh); else render();
    await DB.setMeta('dirIndex', seen);
  } catch (e) { FOLDER.last = { at: new Date(), error: String(e.message || e) }; render(); }
  finally { FOLDER.busy = false; folderButton(); }
}
async function loadFiles(files) {
  files = [...files];
  if (!files.length) return;
  state.tab = 'data'; render();
  const prog = document.getElementById('prog'), txt = document.getElementById('progText'), bar = document.getElementById('progBar');
  state.errors = []; state.replaced = 0;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    if (prog) { prog.classList.remove('hide'); txt.textContent = `Разбираю ${i + 1} из ${files.length}: ${files[i].name}`; bar.style.width = `${i / files.length * 100}%`; }
    const res = files[i].size > 200e6 ? { ok: false, code: 'TOO_BIG' } : await parseFile(files[i]);
    if (!res.ok) { state.errors.push({ name: files[i].name, code: res.code, error: (REJECT_TEXT[res.code] || REJECT_TEXT.ERROR)(res.extra, res.error) }); continue; }
    if (state.reports.some(r => DB.key(r) === DB.key(res.report))) state.replaced = (state.replaced || 0) + 1;
    await DB.put(res.report); ok++;
  }
  await reload();
  const ch1 = await loadIssSwap(), ch2 = await loadIssBonds(); if (ch1 || ch2) M = model();
  state.lastLoad = { ok, total: files.length, replaced: state.replaced };
  state.tab = state.errors.length || !ok ? 'data' : 'summary'; render();
}
function bindDrop(el) {
  if (!el) return;
  el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
  el.ondragleave = () => el.classList.remove('over');
  el.ondrop = e => { e.preventDefault(); el.classList.remove('over'); loadFiles(e.dataTransfer.files); };
}
document.body.addEventListener('dragover', e => e.preventDefault());
document.body.addEventListener('drop', e => { e.preventDefault(); if (!e.target.closest('#drop')) loadFiles(e.dataTransfer.files); });
document.getElementById('btnLoad').onclick = () => document.getElementById('fileInput').click();
document.getElementById('btnFolder').onclick = () => folderScan();
document.getElementById('fileInput').onchange = e => { loadFiles(e.target.files); e.target.value = ''; };

/* ---------- отрисовка ---------- */
const PARSER_VERSION = +(/PARSER_VERSION\s*=\s*(\d+)/.exec(document.getElementById('parserSrc').textContent) || [])[1];
async function reload() {
  state.reports = await DB.all();
  state.stale = state.reports.filter(r => r.v !== PARSER_VERSION);
  M = model();
  const sel = document.getElementById('fAcc'), cur = state.acc;
  sel.innerHTML = (M.accs.length > 1 ? '<option value="__all">все вместе</option>' : '') + M.accs.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
  state.acc = [...sel.options].some(o => o.value === cur) ? cur : sel.options[0]?.value || '__all';
  sel.value = state.acc;
  const all = state.reports.map(r => r.date).sort();
  for (const id of ['fFrom', 'fTo']) { const i = document.getElementById(id); i.min = all[0] || ''; i.max = all.at(-1) || ''; }
}
function credits() {
  const orig = /^https?:/.test(APP.origin) ? ` · <a href="${APP.origin}" target="_blank" rel="noopener">оригинал и проверка подлинности</a>` : '';
  const ver = APP.version.startsWith('__') ? '<b class="warn">рабочий исходник, не для распространения — раздавайте собранный dist/index.html</b>' : `версия ${APP.version}${APP.built.startsWith('__') ? '' : ' от ' + APP.built}`;
  document.getElementById('credits').innerHTML = `${APP.name} · ${ver} · © 2026 ${APP.author}, <a href="${APP.contact}" target="_blank" rel="noopener">${APP.contactText}</a> · лицензия <a href="${APP.licenseUrl}" target="_blank" rel="noopener">${APP.license}</a>: бесплатно, с указанием автора, без коммерческого использования и без изменённых копий${orig}`;
}
// пропуски справок внутри загруженного периода каждого счёта (с учётом фильтра дат)
function gapsBanner(sel) {
  const out = [];
  for (const s of sel) {
    const ds = s.days.map(d => d.date); if (ds.length < 2) continue;
    const have = new Set(ds), miss = [];
    for (let d = addDays(ds[0], 1); d < ds.at(-1); d = addDays(d, 1)) {
      if (weekday(d) % 6 !== 0 && !have.has(d)) miss.push(d);
    }
    if (!miss.length) continue;
    const ranges = []; let a = miss[0], b = miss[0];
    for (const d of miss.slice(1)) {
      const isNextWorkDay = d === addDays(b, 1) || (weekday(b) === 5 && d === addDays(b, 3));
      if (isNextWorkDay) b = d;
      else { ranges.push([a, b]); a = b = d; }
    }
    ranges.push([a, b]);
    out.push(`по счёту <b>${esc(s.acc)}</b> не хватает справок за ${miss.length} торг. дн.: ${ranges.map(([x, y]) => x === y ? ddmm(x) : ddmm(x) + '–' + ddmm(y)).join(', ')}`);
  }
  return out.length ? `<div class="rejected gaps"><h2>Не хватает справок за торговые дни — цифры за период неполные</h2><ul>${out.map(x => `<li>${x}</li>`).join('')}</ul>
    <p class="note" style="margin:6px 0 0">За пропущенные торговые дни не учтены изменение стоимости счёта, маржа, списания и сделки. Загрузите полные справки за эти даты на вкладке «Данные».</p></div>` : '';
}
// ключ подтверждения: счёт + период — окно не блокирует при переключении вкладок
function periodBanner(sel) {
  const items = [];
  for (const s of sel) {
    const lasts = s.days.filter(d => d.partial && d.r.period.last);
    for (const d of lasts) items.push(`по счёту <b>${esc(s.acc)}</b> ${ddmm(d.r.period.from)}–${ddmm(d.r.period.to)} — справка за период` +
      (d.vmApprox ? `; <span class="neg">маржа дня перед периодом неизвестна — загрузите однодневную справку за последний торговый день перед ним, ${ddmm(lastClearingBefore(d.r.period.from))}, иначе срочный и фондовый рынок разделены приблизительно (общая прибыль точная)</span>` : ''));
  }
  return items.length ? `<div class="rejected" style="border-color:var(--warn);margin:0 0 16px"><h2 style="color:var(--warn)">Есть справки за период</h2><ul style="margin:4px 0 0 18px">${items.map(x => `<li>${x}</li>`).join('')}</ul>
    <p style="margin:6px 0 0"><b>Прибыль по дням внутри периода не видна: вся прибыль за период показана последним днём периода.</b> Нужна прибыль по дням — скачайте справки за каждый день.</p>
    <p class="note" style="margin:6px 0 0">По справке за период известны затраты, ставки брокера, сделки, фандинг, РЕПО и купоны по дням, а стоимость счёта, деньги и ГО — только на начало и конец. Вкладка «ГО и обязательства» показывает только дни с однодневными справками.</p></div>` : '';
}
const gapKey = () => [state.acc, state.from, state.to].join('|');
function render() {
  credits();
  document.getElementById('view').classList.remove('blocked');
  charts.splice(0).forEach(c => c.destroy());
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab));
  document.querySelectorAll('#fGroup button').forEach(b => b.classList.toggle('on', b.dataset.g === state.group));
  const el = document.getElementById('view');
  if (state.tab === 'data' || !M || !M.accs.length) { if (state.tab !== 'data' && (!M || !M.accs.length)) state.tab = 'data'; V.data(el); }
  else {
    const sel = selected(); V[state.tab](el, sel); const g = gapsBanner(sel); const pb = periodBanner(sel);
    if (pb) el.insertAdjacentHTML('afterbegin', pb);
    if (g) {
      el.insertAdjacentHTML('afterbegin', g);
      if (state.gapAck !== gapKey()) {
        el.classList.add('blocked');
        el.insertAdjacentHTML('afterbegin', `<div class="blocker"><div class="blockcard">${g.replace('class="rejected gaps"', 'class="rejected"')}
          <div class="blockbtns"><button class="primary" id="gapLoad">Загрузить недостающие справки</button>
          <button id="gapShow">Показать неполные цифры</button></div></div></div>`);
        el.querySelector('#gapLoad').onclick = () => { state.tab = 'data'; render(); };
        el.querySelector('#gapShow').onclick = () => { state.gapAck = gapKey(); render(); };
      }
    }
  }
  if (state.stale?.length) {
    const accs = [...new Set(state.stale.map(r => r.account))].join(', ');
    el.insertAdjacentHTML('afterbegin', `<div class="rejected" style="margin:0 0 16px"><h2>Справки разобраны предыдущей версией страницы: ${state.stale.length}</h2>
      <p class="note" style="margin:0">Счета: ${esc(accs)}. Новая версия достаёт из справки больше (переводы, выводы, фандинг, сборы по рынкам), а пересчитать старые разборы без исходных файлов нельзя. Перетащите эти справки на страницу ещё раз — они заменят старые. До этого часть цифр будет нулевой.</p></div>`);
  }
}
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) { state.tab = b.dataset.t; render(); } };
document.getElementById('fGroup').onclick = e => { const b = e.target.closest('button'); if (b) { state.group = b.dataset.g; render(); } };
document.getElementById('fAcc').onchange = e => { state.acc = e.target.value; render(); };
document.getElementById('fFrom').onchange = e => { state.from = e.target.value; render(); };
document.getElementById('fTo').onchange = e => { state.to = e.target.value; render(); };
if (window.Chart) { Chart.defaults.font.family = "'IBM Plex Sans', system-ui, sans-serif"; }
reload().then(() => { render(); return Promise.all([loadIssSwap(), loadIssBonds()]); }).then(ch => { if (ch.some(Boolean)) { M = model(); render(); } })
  .then(() => folderInit()).then(() => { if (FOLDER.handle && FOLDER.perm === 'granted') return folderScan(); }).catch(err => { document.getElementById('view').innerHTML = `<div class="empty">Не удалось открыть хранилище браузера: ${err}</div>`; });
</script>
</body>
